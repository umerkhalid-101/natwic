<svg
  width="1200"
  height="1200"
  viewBox="0 0 1200 1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Dot pattern -->
    <pattern
      id="dotPattern"
      width="10"
      height="10"
      patternUnits="userSpaceOnUse"
    >
      <circle cx="1.5" cy="1.5" r="1.2" fill="#000" />
    </pattern>

    <!-- Radial fade for ring -->
    <radialGradient id="ringFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="30%" stop-color="white" stop-opacity="0" />
      <stop offset="42%" stop-color="white" stop-opacity="0.35" />
      <stop offset="52%" stop-color="white" stop-opacity="0.65" />
      <stop offset="62%" stop-color="white" stop-opacity="0.35" />
      <stop offset="75%" stop-color="white" stop-opacity="0.05" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>

    <mask id="ringMask">
      <rect width="100%" height="100%" fill="url(#ringFade)" />
    </mask>
  </defs>

  <!-- Halftone ring -->
  <circle
    cx="600"
    cy="600"
    r="520"
    fill="url(#dotPattern)"
    mask="url(#ringMask)"
  />
</svg>
